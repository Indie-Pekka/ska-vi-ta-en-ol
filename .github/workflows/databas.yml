# Kör nya databasändringar (supabase/migrations) mot Supabase
# när de kommer till main. Kräver två hemligheter i repot:
#   SUPABASE_ACCESS_TOKEN  – åtkomsttoken från Supabase-kontot
#   SUPABASE_DB_PASSWORD   – projektets databaslösenord
name: Databas

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/databas.yml"
  workflow_dispatch:

concurrency:
  group: databas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: eapnaoohdqnekodclgzp
    steps:
      - uses: actions/checkout@v4

      - name: Kolla att hemligheterna finns
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Hemligheterna SUPABASE_ACCESS_TOKEN och SUPABASE_DB_PASSWORD saknas i repots inställningar."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Koppla till projektet
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Kör nya databasändringar
        run: supabase db push --yes --remote

      # Nyckelpar för notiser. Skapas bara första gången och
      # sparas direkt som hemligheter i Supabase; den hemliga
      # delen skrivs aldrig ut.
      - name: Notisnycklar
        run: |
          if supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" | grep -q VAPID_PUBLIC_KEY; then
            echo "Notisnycklarna finns redan."
          else
            keys=$(npx -y web-push@3.6.7 generate-vapid-keys --json)
            pub=$(echo "$keys" | jq -r .publicKey)
            priv=$(echo "$keys" | jq -r .privateKey)
            echo "::add-mask::$priv"
            supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
              VAPID_PUBLIC_KEY="$pub" VAPID_PRIVATE_KEY="$priv" \
              VAPID_SUBJECT="https://indie-pekka.github.io/ska-vi-ta-en-ol/" > /dev/null
            echo "Notisnycklar skapade."
          fi

      - name: Publicera notisfunktionen
        run: supabase functions deploy notify --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Kolla notisfunktionen
        run: |
          sleep 5
          out=$(curl -sS "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/notify")
          echo "$out" | sed -E 's/"publicKey":"[^"]{12}[^"]*"/"publicKey":"(finns)"/'
          echo "$out" | grep -q '"ready":true' || { echo "::error::Notisfunktionen är inte redo."; exit 1; }
